spring:
  application:
    name: fintrack

  datasource:
    url: jdbc:postgresql://localhost:5433/fintrack
    username: fintrack
    password: fintrack
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USER:placeholder}
    password: ${MAILGUN_API_KEY:placeholder}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:thisIsAVeryLongSecretKeyForDevelopmentOnlyChangeInProduction123456}
    expiry-minutes: 15
    refresh-expiry-days: 7
  frontend-url: http://localhost:5173

logging:
  level:
    root: INFO
    com.fintrack: DEBUG
    org.springframework.security: WARN